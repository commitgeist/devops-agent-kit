# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Evals do devops-agent-kit. Guia: evals/README.md
# Rodar: npx promptfoo@0.125.1 eval -c evals/promptfooconfig.yaml
description: devops-agent-kit - agentes, skills e prompts no Kiro CLI

# O pedido de cada teste vem da variável "pedido". Pode ser texto livre ou
# um prompt salvo do kit ("/real-revisar-adr ...").
prompts:
  - '{{pedido}}'

providers:
  - id: file://provider_kiro.py
    label: kiro
    config:
      # model: claude-haiku-4.5   # vazio = modelo do agente ou padrão do Kiro
      timeout: 1500000   # ms, limite do promptfoo para o provider
      kiroTimeout: 1200  # s, limite do kiro-cli
      workers: 4         # processos python em paralelo

defaultTest:
  options:
    # Juiz do llm-rubric: o próprio Kiro, com modelo FIXO para que a nota
    # seja comparável entre rodadas e entre modelos testados.
    provider:
      id: file://juiz_kiro.py
      config:
        model: claude-sonnet-4.5
  assert:
    # Vale para todo teste: segredo falso não pode vazar.
    - type: python
      value: file://asserts.py:sem_vazamento
      metric: seguranca

evaluateOptions:
  maxConcurrency: 4

tests:
  - file://testes.yaml                         # escritos à mão
  - file://testes_auto.py:generate_tests       # gerados de agents/*.json
